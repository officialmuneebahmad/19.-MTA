<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="100%" stop-color="#EFECE3"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2C"/>
      <stop offset="100%" stop-color="#E8501A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="560" height="560" rx="24" fill="none" stroke="#E2DFD2" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Central Tech Device Icon -->
  <g transform="translate(180, 160)">
    <!-- Rounded Box representing hardware device -->
    <rect x="0" y="0" width="240" height="180" rx="20" fill="#FFFFFF" stroke="#D1CDC0" stroke-width="3" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.04))"/>
    
    <!-- Power/Status Accent Dot -->
    <circle cx="210" cy="30" r="6" fill="#14B8A6"/>
    
    <!-- USB-C / Lightning Port Silhouette -->
    <rect x="85" y="155" width="70" height="14" rx="7" fill="#E8E6DC" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Modern Tech Glyph in Center (Lightning + Shield) -->
    <path d="M125 40 L95 100 L118 100 L112 140 L145 80 L122 80 Z" fill="url(#iconGrad)"/>
  </g>

  <!-- Typography -->
  <text x="300" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="#141413" text-anchor="middle" letter-spacing="-0.5">MULTAN TECH ACCESSORIES</text>
  <text x="300" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#78716C" text-anchor="middle" letter-spacing="1">AUTHENTIC TECH &amp; ACCESSORIES</text>

  <!-- Assurance Pill -->
  <g transform="translate(190, 470)">
    <rect width="220" height="38" rx="19" fill="#FFFFFF" stroke="#E2DFD2" stroke-width="1.5"/>
    <text x="110" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FF6B2C" text-anchor="middle">100% Verified Quality</text>
  </g>
</svg>