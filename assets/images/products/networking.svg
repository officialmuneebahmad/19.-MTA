<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="100%" stop-color="#F1EFE8"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="468" height="468" rx="24" fill="none" stroke="#E5E2D6" stroke-width="2"/>
  
  <!-- Category Device Silhouette -->
  <g transform="translate(130, 80)">
    <rect x="-10" y="-10" width="260" height="260" rx="32" fill="#FFFFFF" stroke="#E2DFD2" stroke-width="2" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.03))"/>
    <rect x="55" y="110" width="130" height="60" rx="14" fill="#06B6D4"/><line x1="85" y1="110" x2="65" y2="50" stroke="#0891B2" stroke-width="8" stroke-linecap="round"/><line x1="155" y1="110" x2="175" y2="50" stroke="#0891B2" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Title & Branding -->
  <text x="250" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="#141413" text-anchor="middle">Networking &amp; Wireless</text>
  <text x="250" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#78716C" text-anchor="middle" letter-spacing="0.5">MULTAN TECH ACCESSORIES</text>

  <!-- Verified Badge -->
  <g transform="translate(170, 428)">
    <rect width="160" height="30" rx="15" fill="#FFFFFF" stroke="#E2DFD2" stroke-width="1.5"/>
    <text x="80" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#06B6D4" text-anchor="middle">Authentic Stock</text>
  </g>
</svg>