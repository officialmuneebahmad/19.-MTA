---
deployment:
  tasks:
    # 1. Target directory (exact server home path from cPanel)
    - export DEPLOYPATH=/home/sites/28b/d/d1b38d28af

    # 2. Deploy backend core (/app) safely outside public_html
    - /bin/mkdir -p $DEPLOYPATH/app
    - /bin/cp -rf app/. $DEPLOYPATH/app/

    # 3. Deploy public web files & assets directly into public_html (no nested folder)
    - /bin/mkdir -p $DEPLOYPATH/public_html
    - /bin/cp -rf public_html/. $DEPLOYPATH/public_html/

    # 4. Ensure storage directory write permissions
    - /bin/chmod -R 775 $DEPLOYPATH/app/storage

