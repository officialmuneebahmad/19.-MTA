---
deployment:
  tasks:
    # 1. Target directory ($HOME automatically points to /home/your_cpanel_username)
    - export DEPLOYPATH=$HOME

    # 2. Deploy backend core (/app) safely outside public_html
    - /bin/mkdir -p $DEPLOYPATH/app
    - /bin/cp -R app/* $DEPLOYPATH/app/

    # 3. Deploy public web files & assets to public_html
    - /bin/mkdir -p $DEPLOYPATH/public_html
    - /bin/cp -R public_html/* $DEPLOYPATH/public_html/
    - /bin/cp public_html/.htaccess $DEPLOYPATH/public_html/

    # 4. Ensure storage directory write permissions
    - /bin/chmod -R 775 $DEPLOYPATH/app/storage
